name: Build Gradle Cache

on:
  workflow_dispatch:

jobs:
  build-gradle-cache:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/gradle-home

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create dependency test project
        run: |
          mkdir -p test-gradle
          cd test-gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "test-gradle"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'base'
          }

          repositories {
              google()
              mavenCentral()
          }

          configurations {
              godotDependencies
          }

          dependencies {
              godotDependencies 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
              godotDependencies 'androidx.fragment:fragment:1.8.6'
              godotDependencies 'androidx.core:core-splashscreen:1.0.1'
              godotDependencies 'androidx.documentfile:documentfile:1.1.0'
          }

          tasks.register('downloadGodotDependencies') {
              doLast {
                  println "Resolving dependencies..."

                  configurations.godotDependencies.resolve().each { file ->
                      println "RESOLVED: ${file}"
                  }
              }
          }
          EOF

      - name: Download dependencies into dedicated Gradle home
        working-directory: test-gradle
        run: |
          gradle --no-daemon \
            --refresh-dependencies \
            downloadGodotDependencies

      - name: Verify Kotlin dependency
        run: |
          echo "=== Kotlin stdlib files ==="

          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.1.21" \
            -type f -print

          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.1.21"

      - name: Verify AndroidX Fragment
        run: |
          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.fragment/fragment/1.8.6"

      - name: Verify AndroidX SplashScreen
        run: |
          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.core/core-splashscreen/1.0.1"

      - name: Verify AndroidX DocumentFile
        run: |
          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.documentfile/documentfile/1.1.0"

      - name: Test the same dependencies offline
        working-directory: test-gradle
        run: |
          gradle --no-daemon \
            --offline \
            downloadGodotDependencies

      - name: Show cache contents
        run: |
          echo "=== Kotlin ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.1.21" \
            -type f | sort

          echo
          echo "=== Fragment ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.fragment/fragment/1.8.6" \
            -type f | sort

          echo
          echo "=== SplashScreen ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.core/core-splashscreen/1.0.1" \
            -type f | sort

          echo
          echo "=== DocumentFile ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.documentfile/documentfile/1.1.0" \
            -type f | sort

      - name: Show cache size
        run: |
          du -sh "$GRADLE_USER_HOME/caches/modules-2"

      - name: Package cache
        run: |
          rm -rf artifact
          mkdir artifact

          cp -a "$GRADLE_USER_HOME/caches/modules-2" artifact/

          cd artifact
          zip -r "$GITHUB_WORKSPACE/gradle-dependencies-v3.zip" modules-2

      - name: Verify ZIP before upload
        run: |
          echo "=== Kotlin in ZIP ==="
          unzip -l gradle-dependencies-v3.zip \
            | grep 'kotlin-stdlib-2.1.21' \
            | head -20

          echo
          echo "=== AndroidX in ZIP ==="
          unzip -l gradle-dependencies-v3.zip \
            | grep -E 'fragment-1.8.6|core-splashscreen-1.0.1|documentfile-1.1.0' \
            | head -20

          echo
          echo "=== ZIP size ==="
          ls -lh gradle-dependencies-v3.zip

      - name: Upload verified cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-dependencies-v3
          path: gradle-dependencies-v3.zip
          retention-days: 7
