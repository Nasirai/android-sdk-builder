name: Build Gradle Cache

on:
  workflow_dispatch:

jobs:
  build-gradle-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create test Gradle project
        run: |
          mkdir -p test-gradle
          cd test-gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "test-gradle"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.1.21' apply false
          }
          EOF

      - name: Download Android Gradle Plugin
        working-directory: test-gradle
        run: |
          gradle help --refresh-dependencies

      - name: Show Gradle cache
        run: |
          echo "Gradle cache:"
          du -sh ~/.gradle
          find ~/.gradle/caches -type f | grep -E '8\.6\.1|com.android.application' | head -30

      - name: Package Gradle dependency cache
        run: |
          mkdir -p gradle-cache
          cp -a ~/.gradle/caches/modules-2 gradle-cache/

      - name: Upload Gradle dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-dependencies
          path: gradle-cache
          retention-days: 7
