name: Build Gradle Cache

on:
  workflow_dispatch:

jobs:
  build-gradle-cache:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/gradle-home
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android test project
        run: |
          mkdir -p test-gradle/app/src/main/res/values
          cd test-gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://plugins.gradle.org/m2/" }
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "test-gradle"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.1.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.testgradle'
              compileSdk 35
              buildToolsVersion '35.0.1'

              defaultConfig {
                  applicationId 'com.example.testgradle'
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'

              implementation 'androidx.fragment:fragment:1.8.6'
              implementation 'androidx.core:core-splashscreen:1.0.1'
              implementation 'androidx.documentfile:documentfile:1.1.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="Gradle Cache Test">

                  <activity
                      android:name="android.app.Activity"
                      android:exported="true" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                     parent="@android:style/Theme.Material.Light.NoActionBar">
              </style>
          </resources>
          EOF

      - name: Build Android project online
        working-directory: test-gradle
        run: |
          gradle --no-daemon \
            --refresh-dependencies \
            :app:assembleDebug

      - name: Show important downloaded dependencies
        run: |
          echo "=== Android Gradle Plugin ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/com.android.application" \
            -type f | sort | head -30

          echo
          echo "=== AAPT2 ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/com.android.tools.build/aapt2" \
            -type f | sort

          echo
          echo "=== Kotlin stdlib ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.1.21" \
            -type f | sort

          echo
          echo "=== AndroidX Fragment ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.fragment/fragment/1.8.6" \
            -type f | sort

          echo
          echo "=== SplashScreen ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.core/core-splashscreen/1.0.1" \
            -type f | sort

          echo
          echo "=== DocumentFile ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.documentfile/documentfile/1.1.0" \
            -type f | sort

      - name: Test the downloaded cache completely offline
        working-directory: test-gradle
        run: |
          gradle --no-daemon \
            --offline \
            :app:assembleDebug

      - name: Show final cache size
        run: |
          echo "Gradle modules-2 cache:"
          du -sh "$GRADLE_USER_HOME/caches/modules-2"

      - name: Prepare artifact directory
        run: |
          rm -rf artifact
          mkdir -p artifact

          cp -a "$GRADLE_USER_HOME/caches/modules-2" \
            artifact/modules-2

      - name: Show artifact contents
        run: |
          echo "Artifact root:"
          find artifact/modules-2 -maxdepth 2 -type d | sort | head -50

          echo
          echo "Artifact size:"
          du -sh artifact/modules-2

      - name: Upload Gradle modules cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-modules-cache-final
          path: artifact/modules-2
          retention-days: 7
