name: Build Gradle Cache

on:
  workflow_dispatch:

jobs:
  build-gradle-cache:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/gradle-home

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create dependency test project
        run: |
          mkdir -p test-gradle
          cd test-gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://plugins.gradle.org/m2/" }
                  maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "test-gradle"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.1.21' apply false
          }

          configurations {
              godotDependencies
          }

          repositories {
              google()
              mavenCentral()
          }

          dependencies {
              godotDependencies 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
              godotDependencies 'androidx.fragment:fragment:1.8.6'
              godotDependencies 'androidx.core:core-splashscreen:1.0.1'
              godotDependencies 'androidx.documentfile:documentfile:1.1.0'
          }

          tasks.register('downloadGodotDependencies') {
              doLast {
                  configurations.godotDependencies.resolve().each {
                      println "RESOLVED: ${it}"
                  }
              }
          }
          EOF

      - name: Resolve Android Gradle Plugin and dependencies
        working-directory: test-gradle
        run: |
          gradle --no-daemon \
            --refresh-dependencies \
            help \
            downloadGodotDependencies

      - name: Verify AGP
        run: |
          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/com.android.application/com.android.application.gradle.plugin/8.6.1"

      - name: Verify Kotlin stdlib
        run: |
          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.1.21"

      - name: Verify AndroidX dependencies
        run: |
          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.fragment/fragment/1.8.6"

          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.core/core-splashscreen/1.0.1"

          test -d \
            "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.documentfile/documentfile/1.1.0"

      - name: Test dependencies offline
        working-directory: test-gradle
        run: |
          gradle --no-daemon \
            --offline \
            help \
            downloadGodotDependencies

      - name: Show verified cache
        run: |
          echo "=== AGP ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/com.android.application/com.android.application.gradle.plugin/8.6.1" \
            -type f

          echo
          echo "=== Kotlin stdlib ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.1.21" \
            -type f

          echo
          echo "=== AndroidX Fragment ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.fragment/fragment/1.8.6" \
            -type f

          echo
          echo "=== SplashScreen ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.core/core-splashscreen/1.0.1" \
            -type f

          echo
          echo "=== DocumentFile ==="
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/androidx.documentfile/documentfile/1.1.0" \
            -type f

      - name: Package verified modules cache
        run: |
          rm -rf artifact
          mkdir -p artifact

          cp -a "$GRADLE_USER_HOME/caches/modules-2" artifact/

          cd artifact
          tar -czf "$GITHUB_WORKSPACE/gradle-modules-cache.tar.gz" modules-2

      - name: Show artifact size
        run: |
          ls -lh gradle-modules-cache.tar.gz

      - name: Upload verified cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-modules-cache
          path: gradle-modules-cache.tar.gz
          retention-days: 7
