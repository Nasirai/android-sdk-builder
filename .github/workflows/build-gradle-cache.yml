name: Build Gradle Cache

on:
  workflow_dispatch:

jobs:
  build-gradle-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create test Gradle project
        run: |
          mkdir -p test-gradle
          cd test-gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "test-gradle"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.1.21' apply false
          }

          configurations {
              godotDependencies
          }

          dependencies {
              godotDependencies 'androidx.fragment:fragment:1.8.6'
              godotDependencies 'androidx.core:core-splashscreen:1.0.1'
              godotDependencies 'androidx.documentfile:documentfile:1.1.0'
          }

          tasks.register('downloadGodotDependencies') {
              doLast {
                  configurations.godotDependencies.files.each {
                      println "Downloaded: $it"
                  }
              }
          }
          EOF

      - name: Download AndroidX dependencies
        working-directory: test-gradle
        run: |
          gradle downloadGodotDependencies --refresh-dependencies

      - name: Verify AndroidX dependencies
        run: |
          echo "========================================"
          echo "Downloaded AndroidX dependencies:"
          echo "========================================"

          find ~/.gradle/caches/modules-2/files-2.1/androidx \
            -type f | sort

          echo ""
          echo "========================================"
          echo "Cache size:"
          echo "========================================"

          du -sh ~/.gradle/caches/modules-2

      - name: Package Gradle dependency cache
        run: |
          mkdir -p gradle-cache
          cp -a ~/.gradle/caches/modules-2 gradle-cache/

      - name: Upload Gradle dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-dependencies
          path: gradle-cache
          retention-days: 7
