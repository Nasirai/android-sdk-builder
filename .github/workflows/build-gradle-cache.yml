name: Build Gradle Cache

on:
  workflow_dispatch:

jobs:
  build-gradle-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create dependency test project
        run: |
          mkdir -p test-gradle
          cd test-gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "test-gradle"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'base'
          }

          repositories {
              google()
              mavenCentral()
          }

          configurations {
              godotDependencies
          }

          dependencies {
              // Direct dependency used by the Godot 4.7 Android project.
              godotDependencies 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'

              // Direct dependencies used by the Godot 4.7 Android project.
              godotDependencies 'androidx.fragment:fragment:1.8.6'
              godotDependencies 'androidx.core:core-splashscreen:1.0.1'
              godotDependencies 'androidx.documentfile:documentfile:1.1.0'
          }

          tasks.register('downloadGodotDependencies') {
              doLast {
                  configurations.godotDependencies.files.each {
                      println "Resolved: $it"
                  }
              }
          }
          EOF

      - name: Download all required dependencies
        working-directory: test-gradle
        run: |
          gradle downloadGodotDependencies --refresh-dependencies

      - name: Verify required files exist
        run: |
          echo "Checking Kotlin stdlib..."
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.1.21"

          echo "Checking AndroidX Fragment..."
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/androidx.fragment/fragment/1.8.6"

          echo "Checking AndroidX SplashScreen..."
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/androidx.core/core-splashscreen/1.0.1"

          echo "Checking AndroidX DocumentFile..."
          test -d "$HOME/.gradle/caches/modules-2/files-2.1/androidx.documentfile/documentfile/1.1.0"

          echo
          echo "All required direct dependencies are present."

      - name: Test dependency resolution completely offline
        working-directory: test-gradle
        run: |
          gradle downloadGodotDependencies --offline

      - name: Show relevant cache contents
        run: |
          echo "=== Kotlin stdlib ==="
          find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib/2.1.21" \
            -type f | sort

          echo
          echo "=== AndroidX Fragment ==="
          find "$HOME/.gradle/caches/modules-2/files-2.1/androidx.fragment/fragment/1.8.6" \
            -type f | sort

          echo
          echo "=== AndroidX SplashScreen ==="
          find "$HOME/.gradle/caches/modules-2/files-2.1/androidx.core/core-splashscreen/1.0.1" \
            -type f | sort

          echo
          echo "=== AndroidX DocumentFile ==="
          find "$HOME/.gradle/caches/modules-2/files-2.1/androidx.documentfile/documentfile/1.1.0" \
            -type f | sort

      - name: Show cache size
        run: |
          echo "Gradle modules-2 cache size:"
          du -sh "$HOME/.gradle/caches/modules-2"

      - name: Package Gradle modules cache
        run: |
          mkdir -p artifact

          cp -a "$HOME/.gradle/caches/modules-2" artifact/

          cd artifact
          zip -r "$GITHUB_WORKSPACE/gradle-dependencies.zip" modules-2

      - name: Show artifact size
        run: |
          ls -lh gradle-dependencies.zip

      - name: Upload Gradle dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-dependencies
          path: gradle-dependencies.zip
          retention-days: 7
